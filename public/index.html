<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aachen Bushof · Abfahrten</title>
  <meta name="description" content="Live-Abfahrten für den Aachener Bushof und alle Haltestellen im AVV, mit Steig, Ausfällen und Störungsmeldungen." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" />
  <link rel="stylesheet" href="/css/led.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="top glow">
      <div class="top-row led">
        <h1 id="station-name">Aachen, Bushof</h1>
        <time class="clock" id="clock"></time>
      </div>
    </header>

    <div class="search" id="search">
      <label class="sr-only" for="search-input">Haltestelle suchen</label>
      <input id="search-input" class="search-input" type="search" placeholder="Andere Haltestelle suchen …"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
        autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
      <ul class="search-results" id="search-results" role="listbox" aria-label="Haltestellen" hidden></ul>
    </div>

    <p class="status" id="status" role="status" hidden><span class="dot" aria-hidden="true"></span><span class="status-text"></span></p>

    <section class="notices" id="notices" hidden aria-label="Hinweise">
      <div class="glow"><div class="ticker led" id="ticker" aria-hidden="true"></div></div>
      <details class="notice-list" id="notice-list">
        <summary id="notice-summary"></summary>
        <ul id="notice-items"></ul>
      </details>
    </section>

    <nav class="filter" aria-label="Nach Linien filtern">
      <div class="filter-bar">
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filter-panel">Alle Linien</button>
        <button type="button" class="filter-clear" id="filter-clear" hidden>Filter aufheben</button>
      </div>
      <div class="filter-panel" id="filter-panel" hidden>
        <p class="filter-hint">Mehrere Linien wählbar</p>
        <div class="filter-grid" id="filters"></div>
      </div>
    </nav>

    <section class="board glow" aria-labelledby="board-title">
      <h2 id="board-title" class="sr-only">Nächste Abfahrten</h2>
      <ol class="rows led" id="rows" aria-busy="true">
        <li class="placeholder">Abfahrten werden geladen</li>
      </ol>
    </section>

    <footer class="foot">
      <span>Daten: <a href="https://www.avv.de" rel="noopener">AVV</a> / ASEAG</span>
      <a href="/anzeige" id="display-link">Anzeige-Modus</a>
    </footer>
  </div>
</body>
</html>
