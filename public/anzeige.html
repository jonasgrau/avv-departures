<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aachen Bushof · Anzeige</title>
  <meta name="description" content="Abfahrtstafel für den Aachener Bushof im Stil der LED-Anzeigen an den Haltestellen." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preload" href="/fonts/jersey10-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/led.css" />
  <link rel="stylesheet" href="/css/anzeige.css" />
  <script type="module" src="/js/anzeige.js"></script>
</head>
<body>
  <main class="panel">
    <h1 class="sr-only" id="title">Abfahrten Aachen Bushof</h1>
    <div class="board led">
      <ol class="rows" id="rows" aria-labelledby="title"></ol>
      <div class="bottom">
        <div class="ticker" id="ticker" aria-live="polite"></div>
        <time class="clock" id="clock"></time>
      </div>
    </div>
  </main>
</body>
</html>
