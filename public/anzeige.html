<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aachen Bushof · Anzeige</title>
  <meta name="description" content="Abfahrtstafel für den Aachener Bushof im Vollbild." />
  <meta name="theme-color" content="#07080a" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/anzeige.css" />
  <script type="module" src="/js/anzeige.js"></script>
</head>
<body>
  <header class="top">
    <div class="station">
      <svg class="stop-sign" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#f4d000" />
        <path d="M12 10h4.5v8h7v-8H28v20h-4.5v-8h-7v8H12z" fill="#1f7a3a" />
      </svg>
      <h1 id="title">Aachen Bushof</h1>
    </div>
    <time class="clock" id="clock"></time>
  </header>

  <div class="cols" aria-hidden="true">
    <span>Linie</span><span>Ziel</span><span class="c">Steig</span><span class="r">Abfahrt</span>
  </div>
  <ol class="rows" id="rows" aria-label="Nächste Abfahrten"></ol>

  <div id="ticker"></div>
  <footer class="foot">
    <span id="status">Verbinde …</span>
    <span>Daten: AVV / ASEAG</span>
  </footer>
</body>
</html>
